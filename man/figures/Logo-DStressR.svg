<svg xmlns="http://www.w3.org/2000/svg" width="980" height="230" viewBox="0 0 980 230" role="img" aria-label="DStressR proposed logo">
  <rect width="980" height="230" fill="#ffffff"/>

  <!-- DGrowthR-style mark: the same single heavy baseline, with a statistical volcano plot in place of the growth curves. -->
  <g transform="translate(20 0)">
    <path d="M14 178 H249" stroke="#000000" stroke-width="5.5" stroke-linecap="square"/>
    <path d="M22 186 V58" stroke="#000000" stroke-width="5.5" stroke-linecap="square"/>

    <!-- Central null guide, as in a statistical volcano plot. -->
    <g stroke="#6b7280" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 8">
      <path d="M128 178 V47"/>
    </g>

    <!-- Sparse volcano points; three larger hits are replaced by symbols below. -->
    <g opacity="0.9">
      <circle cx="120" cy="171" r="2.8" fill="#cbd5e1"/>
      <circle cx="131" cy="169" r="2.8" fill="#cbd5e1"/>
      <circle cx="111" cy="153" r="2.9" fill="#bbf7d0"/>
      <circle cx="143" cy="151" r="2.9" fill="#fed7aa"/>
      <circle cx="101" cy="130" r="3.0" fill="#86efac"/>
      <circle cx="154" cy="129" r="3.0" fill="#fdba74"/>
      <circle cx="91" cy="106" r="3.2" fill="#4ade80"/>
      <circle cx="166" cy="105" r="3.2" fill="#fb923c"/>
      <circle cx="78" cy="84" r="3.3" fill="#22c55e"/>
      <circle cx="180" cy="83" r="3.3" fill="#f97316"/>
      <circle cx="220" cy="111" r="3.4" fill="#ea580c"/>
      <circle cx="114" cy="164" r="2.5" fill="#d1d5db"/>
      <circle cx="137" cy="160" r="2.5" fill="#d1d5db"/>
      <circle cx="122" cy="146" r="2.6" fill="#bbf7d0"/>
      <circle cx="132" cy="139" r="2.6" fill="#fed7aa"/>
      <circle cx="108" cy="118" r="2.8" fill="#86efac"/>
      <circle cx="148" cy="112" r="2.8" fill="#fdba74"/>
      <circle cx="95" cy="92" r="2.9" fill="#4ade80"/>
      <circle cx="158" cy="94" r="2.9" fill="#fb923c"/>
      <circle cx="70" cy="113" r="2.8" fill="#22c55e"/>
      <circle cx="194" cy="117" r="2.8" fill="#f97316"/>
      <circle cx="59" cy="82" r="2.8" fill="#16a34a"/>
      <circle cx="205" cy="91" r="2.8" fill="#ea580c"/>
      <circle cx="84" cy="66" r="2.7" fill="#22c55e"/>
      <circle cx="174" cy="61" r="2.7" fill="#f97316"/>
    </g>

    <!-- Three screen-relevant symbols used as highlighted volcano hits. -->
    <g transform="translate(66 58) rotate(-12)">
      <defs>
        <clipPath id="capsule-clip">
          <rect x="-17" y="-7" width="34" height="14" rx="7" ry="7"/>
        </clipPath>
      </defs>
      <g clip-path="url(#capsule-clip)">
        <rect x="-17" y="-7" width="17" height="14" fill="#f7fee7"/>
        <rect x="0" y="-7" width="17" height="14" fill="#65a30d"/>
        <path d="M0 -7 V7" stroke="#a3a3a3" stroke-width="1"/>
      </g>
      <rect x="-17" y="-7" width="34" height="14" rx="7" ry="7" fill="none" stroke="#64748b" stroke-width="1.3"/>
    </g>

    <g transform="translate(194 58)">
      <g stroke="#4b5563" stroke-width="2" stroke-linecap="round">
        <path d="M0 0 L-15 -10"/>
        <path d="M0 0 L15 -9"/>
        <path d="M0 0 L0 16"/>
        <path d="M15 -9 L25 -2"/>
        <path d="M-15 -10 L-22 -1"/>
      </g>
      <circle cx="0" cy="0" r="6.3" fill="#ffedd5" stroke="#111827" stroke-width="2"/>
      <circle cx="-15" cy="-10" r="3.2" fill="#ffedd5" stroke="#4b5563" stroke-width="1.5"/>
      <circle cx="15" cy="-9" r="3.2" fill="#ffedd5" stroke="#4b5563" stroke-width="1.5"/>
      <circle cx="0" cy="16" r="3.2" fill="#ffedd5" stroke="#4b5563" stroke-width="1.5"/>
      <circle cx="25" cy="-2" r="2.5" fill="#ffedd5" stroke="#4b5563" stroke-width="1.4"/>
      <circle cx="-22" cy="-1" r="2.5" fill="#ffedd5" stroke="#4b5563" stroke-width="1.4"/>
    </g>

    <g transform="translate(52 104)">
      <circle cx="0" cy="0" r="9.5" fill="#fb923c" stroke="#f97316" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="7.2" fill="#fed7aa"/>
      <g fill="#f97316" stroke="#ffffff" stroke-width="0.9">
        <path d="M0 0 L0 -7 A7 7 0 0 1 5 -5 Z"/>
        <path d="M0 0 L5 -5 A7 7 0 0 1 7 0 Z"/>
        <path d="M0 0 L7 0 A7 7 0 0 1 5 5 Z"/>
        <path d="M0 0 L5 5 A7 7 0 0 1 0 7 Z"/>
        <path d="M0 0 L0 7 A7 7 0 0 1 -5 5 Z"/>
        <path d="M0 0 L-5 5 A7 7 0 0 1 -7 0 Z"/>
        <path d="M0 0 L-7 0 A7 7 0 0 1 -5 -5 Z"/>
        <path d="M0 0 L-5 -5 A7 7 0 0 1 0 -7 Z"/>
      </g>
    </g>
  </g>

  <text x="219" y="180" font-family="'Times New Roman', Times, serif" font-size="135" font-weight="400" fill="#000000">DStressR</text>
</svg>
